<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenTrail</title>
<style>
:root, [data-theme="dark"] {
  --bg: #0f1419; --panel: #172029; --panel-2: #1e2a35; --line: #2a3a48; --ink: #e6edf3; --ink-2: #a8b6c3; --ink-3: #7a8a99;
  --accent: #38bdf8; --accent-2: #a78bfa; --good: #34d399; --warn: #fbbf24; --bad: #f87171; --orange: #fb923c; --pink: #f472b6;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f6f8fa; --panel: #ffffff; --panel-2: #f0f3f6; --line: #d4dbe2; --ink: #1b2430; --ink-2: #44515e; --ink-3: #66727e;
  --accent: #0369a1; --accent-2: #6d28d9; --good: #047857; --warn: #b45309; --bad: #b91c1c; --orange: #c2410c; --pink: #be185d;
  --shadow: 0 1px 2px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 18px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; justify-content: center; }
.tab { border: 1px solid var(--line); background: var(--panel-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.tab .n { margin-left: 6px; font-size: 12px; padding: 0 6px; border-radius: 999px; background: var(--line); }
.sync { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.dot.on { background: var(--good); box-shadow: 0 0 6px var(--good); }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
select, input[type=search], input[type=date] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
main { padding: 20px 24px 48px; max-width: 1440px; margin: 0 auto; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 20px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
.filters input[type=search] { min-width: 220px; flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); }
.kpi .l { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.kpi .v { font-size: 34px; line-height: 1.15; font-weight: 700; margin: 8px 0 6px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.kpi.good .v { color: var(--good); } .kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); }
.subtabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h3 { margin: 0 0 4px; font-size: 17px; }
.card .sub { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.card .foot { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.banner { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 14px; background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
svg { display: block; max-width: 100%; }
svg text { fill: var(--ink-2); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.donutwrap { display: grid; grid-template-columns: 190px 1fr; gap: 20px; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; white-space: nowrap; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel-2); }
.tablewrap { overflow-x: auto; max-height: 640px; overflow-y: auto; }
.tablewrap.paged { max-height: none; overflow-y: visible; }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.pager .pages { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.pager .pg { min-width: 38px; padding: 6px 10px; text-align: center; font-variant-numeric: tabular-nums; }
.pager .pg[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 700; }
.pager .pg:disabled { opacity: .4; cursor: default; border-color: var(--line); }
.pager .gap { padding: 0 4px; color: var(--ink-3); }
.pager label { display: inline-flex; align-items: center; gap: 8px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.prompt { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--ink-3); }
.empty { padding: 30px; text-align: center; color: var(--ink-3); }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; max-width: 760px; width: calc(100% - 32px); padding: 18px 20px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog h2 { margin: 0 0 4px; font-size: 18px; }
dialog dl { display: grid; grid-template-columns: 170px 1fr; gap: 8px 14px; margin: 14px 0; font-size: 14px; }
dialog dt { color: var(--ink-3); } dialog dd { margin: 0; word-break: break-word; }
dialog pre { white-space: pre-wrap; background: var(--panel-2); padding: 12px; border-radius: 8px; font-size: 13px; max-height: 220px; overflow: auto; }
.hide { display: none !important; }
.storeline { margin: 0 0 14px; font-size: 13px; color: var(--ink-3); overflow-wrap: anywhere; }
.storeline b { color: var(--ink-2); font-weight: 600; }
a { color: var(--accent); }
@media (max-width: 1100px) { .charts { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .pager .pg.edge { display: none; } .pager .pg { min-width: 34px; padding: 6px 8px; } .pager .pages { gap: 3px; } }
@media (max-width: 700px) { .kpis { grid-template-columns: 1fr; gap: 12px; } .kpi, .card { padding: 16px 16px; } .kpi .v { font-size: 30px; } header { padding: 10px 12px; position: static; } .tabs { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; flex-basis: 100%; } .filters input[type=search] { flex-basis: 100%; } main { padding: 12px; } .charts { grid-template-columns: 1fr; } .donutwrap { grid-template-columns: 1fr; } dialog dl { grid-template-columns: 1fr; } .filters input[type=search] { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>TokenTrail</h1>
  <nav class="tabs" id="modes">
    <button class="tab" data-mode="agents" aria-pressed="true">TokenTrail <span class="n" id="n-agents">0</span></button>
    <button class="tab" data-mode="code" aria-pressed="false">Code Deliverables <span class="n" id="n-code">0</span></button>
    <button class="tab" data-mode="roi" aria-pressed="false">Cross-Domain ROI <span class="n">Live</span></button>
  </nav>
  <div class="sync">
    <span class="dot" id="sync-dot"></span>
    <label>Auto-sync <select id="sync-every"><option value="15">15s</option><option value="30" selected>30s</option><option value="60">60s</option><option value="300">5m</option><option value="0">Off</option></select></label>
    <span id="synced">Not synced</span>
    <button class="btn" id="sync-now" title="Re-scan agent logs now">↻ Sync now</button>
    <button class="btn" id="theme" title="Toggle light and dark">☀</button>
  </div>
</header>
<main>
  <p class="storeline" id="storeline"></p>
  <section class="filters" aria-label="Filters">
    <span class="seg" id="win">
      <button data-days="1">Today</button><button data-days="7">Last 7 days</button><button data-days="30" aria-pressed="true">Last 30 days</button><button data-days="0">All</button>
    </span>
    <label class="muted">From <input type="date" id="from"></label>
    <label class="muted">To <input type="date" id="to"></label>
    <span class="seg" id="gran"><button data-g="runs" aria-pressed="true">Task runs</button><button data-g="convs">Conversations</button></span>
    <input type="search" id="q" placeholder="Search prompts, models, repos, skills, tools…" aria-label="Search">
    <select id="f-agent" aria-label="Agent"></select>
    <select id="f-machine" aria-label="Machine" class="hide"></select>
    <select id="f-model" aria-label="Model"></select>
    <select id="f-health" aria-label="Health outcome"></select>
  </section>

  <!-- AGENTS -->
  <section id="mode-agents">
    <div class="kpis" id="kpis"></div>
    <div class="subtabs" id="ctabs"></div>
    <div class="charts" id="charts"></div>
    <div class="card">
      <h3>Session explorer</h3>
      <p class="sub">Click a row for the full breakdown. Click a column to sort.</p>
      <div class="tablewrap paged" id="runs-wrap"><table id="runs"><thead></thead><tbody></tbody></table></div>
      <p class="foot" id="runs-foot"></p>
    </div>
  </section>

  <!-- CODE -->
  <section id="mode-code" class="hide">
    <div class="kpis" id="ckpis"></div>
    <div class="charts" id="ccharts"></div>
    <div class="card"><h3>Recent commits</h3><div class="tablewrap"><table id="commits"><thead></thead><tbody></tbody></table></div></div>
  </section>

  <!-- ROI -->
  <section id="mode-roi" class="hide">
    <div class="kpis" id="rkpis"></div>
    <div class="charts" id="rcharts"></div>
  </section>
</main>

<dialog id="inspect"><div id="inspect-body"></div><p style="text-align:right;margin:0"><button class="btn" id="inspect-close">Close</button></p></dialog>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (n) => (n ?? 0).toLocaleString("en-US");
  const short = (n) => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(Math.round(n || 0));
  const money = (n) => "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = (a, b) => (b ? (100 * a) / b : 0);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const PALETTE = ["--accent", "--accent-2", "--good", "--warn", "--orange", "--pink", "--bad", "--ink-3"];
  const color = (i) => css(PALETTE[i % PALETTE.length]);
  const H = { HV: "High-Velocity (<=30 steps)", POS: "Positive (Standard)", LOOP: "Friction: Tool Loops", WANDER: "Wandering: Zero File Writes", ERR: "Failure: High Error Rate" };
  const HEALTH_COLOR = { [H.HV]: "--good", [H.POS]: "--accent", [H.LOOP]: "--warn", [H.WANDER]: "--orange", [H.ERR]: "--bad" };
  const HEALTHY = new Set([H.HV, H.POS]);
  const isWrite = (t) => /(^|_)(write|edit|multiedit|replace|create_file|apply_patch|str_replace|notebookedit)/i.test(t);

  const state = { data: null, machine: "", mode: "agents", days: 30, from: "", to: "", gran: "runs", q: "", agent: "", model: "", health: "", chartTab: "all", sort: { key: "started", dir: -1 }, page: 1, pageSize: 25, tableSig: "", timer: null };

  /* ---------- health: same thresholds as segment.py ---------- */
  function classify(r) {
    const steps = Math.max(r.steps, 1), rate = r.tool_errors / Math.max(r.tool_calls, steps);
    if (r.tool_errors >= 4 || (r.steps >= 6 && rate >= 0.2)) return H.ERR;
    if (r.max_repeat >= 4) return H.LOOP;
    if (r.steps > 45 && r.file_writes === 0 && !r.skills.length) return H.WANDER;
    if (r.steps <= 30 && r.tool_errors === 0) return H.HV;
    return H.POS;
  }

  /* ---------- filtering and granularity ---------- */
  function inWindow(ts) {
    if (!ts) return false;
    const d = ts.slice(0, 10);
    if (state.from && d < state.from) return false;
    if (state.to && d > state.to) return false;
    if (!state.from && !state.to && state.days) {
      const t = Date.parse(ts);
      if (state.days === 1) return new Date(t).toDateString() === new Date().toDateString();
      return Date.now() - t <= state.days * 86400000;
    }
    return true;
  }
  function toConversations(runs) {
    const by = new Map();
    for (const r of runs) {
      let c = by.get(r.conversation_id);
      if (!c) { c = { ...r, run_id: r.conversation_id, tools: {}, skills: [], models: [], steps: 0, input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, cache_write_tokens: 0, thinking_tokens: 0, prompt_chars: 0, tool_output_chars: 0, tool_calls: 0, tool_errors: 0, file_writes: 0, subagent_steps: 0, max_repeat: 0, cost_usd: 0, cache_savings_usd: 0, runs: 0, _mc: {} }; by.set(r.conversation_id, c); }
      for (const k of ["steps", "input_tokens", "output_tokens", "cache_read_tokens", "cache_write_tokens", "thinking_tokens", "prompt_chars", "tool_output_chars", "tool_calls", "tool_errors", "file_writes", "subagent_steps", "cost_usd", "cache_savings_usd"]) c[k] += r[k] || 0;
      c.max_repeat = Math.max(c.max_repeat, r.max_repeat); c.runs++;
      for (const [t, n] of Object.entries(r.tools)) c.tools[t] = (c.tools[t] || 0) + n;
      for (const s of r.skills) if (!c.skills.includes(s)) c.skills.push(s);
      if (r.steps) c._mc[r.model] = (c._mc[r.model] || 0) + r.steps;
      if (r.started < c.started) { c.started = r.started; c.prompt = r.prompt; }
      if (r.ended > c.ended) c.ended = r.ended;
      c.priced = c.priced && r.priced;
    }
    return [...by.values()].map((c) => { c.models = Object.keys(c._mc).sort((a, b) => c._mc[b] - c._mc[a]); c.model = c.models[0] || "no response"; c.health = classify(c); return c; });
  }
  function filtered() {
    if (!state.data) return [];
    let runs = state.data.runs.filter((r) => inWindow(r.started));
    if (state.agent) runs = runs.filter((r) => r.agent === state.agent);
    if (state.machine) runs = runs.filter((r) => r.machine === state.machine);
    if (state.gran === "convs") runs = toConversations(runs);
    if (state.model) runs = runs.filter((r) => r.model === state.model);
    if (state.health) runs = runs.filter((r) => r.health === state.health);
    if (state.q) {
      const q = state.q.toLowerCase();
      runs = runs.filter((r) => [r.run_id, r.prompt, r.title, r.model, r.workspace, r.agent, r.machine, r.skills.join(" "), Object.keys(r.tools).join(" ")].join(" ").toLowerCase().includes(q));
    }
    return runs;
  }
  function filteredCommits() {
    if (!state.data) return [];
    const q = state.q.toLowerCase();
    return state.data.commits.filter((c) => inWindow(c.date) && (!q || [c.subject, c.repo, c.author, c.type, c.scope, c.issues.join(" ")].join(" ").toLowerCase().includes(q)));
  }

  /* ---------- KPIs: same definitions as analytics.kpis ---------- */
  function kpis(runs) {
    const n = runs.length, sum = (k) => runs.reduce((a, r) => a + (r[k] || 0), 0);
    const inp = sum("input_tokens") + sum("cache_write_tokens"), out = sum("output_tokens"), read = sum("cache_read_tokens"), steps = sum("steps"), calls = sum("tool_calls"), errs = sum("tool_errors");
    const healthy = runs.filter((r) => HEALTHY.has(r.health)).length, fast = runs.filter((r) => r.health === H.HV).length;
    return { n, convs: new Set(runs.map((r) => r.conversation_id)).size, inp, out, read, tokens: inp + out, hit: pct(read, inp + read), cost: sum("cost_usd"), savings: sum("cache_savings_usd"), unpriced: runs.filter((r) => !r.priced).length, avgSteps: n ? steps / n : 0, steps, healthy: pct(healthy, n), healthyN: healthy, fast: pct(fast, n), calls, errRate: pct(errs, Math.max(calls, steps)) };
  }
  const kpiCard = (l, v, s, cls = "") => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  function renderKpis(runs) {
    const k = kpis(runs);
    $("#kpis").innerHTML = [
      kpiCard("Total sessions", fmt(k.n), `${fmt(k.convs)} conversations · ${state.gran === "runs" ? "per prompt" : "per thread"}`),
      kpiCard("Tokens consumed", short(k.tokens), `${short(k.read)} cache read · ${k.hit.toFixed(1)}% hit · ${money(k.cost)} est.${k.unpriced ? ` (${k.unpriced} unpriced)` : ""}`, k.n ? (k.hit >= 85 ? "good" : k.hit < 75 ? "warn" : "") : ""),
      kpiCard("Average velocity", k.avgSteps.toFixed(1), "steps per " + (state.gran === "runs" ? "task run" : "conversation") + " · lower is faster", k.n && state.gran === "runs" ? (k.avgSteps <= 35 ? "good" : k.avgSteps > 60 ? "bad" : "warn") : ""),
      kpiCard("Healthy sessions", k.healthy.toFixed(1) + "%", `${fmt(k.healthyN)} high-velocity or standard · target ≥ 80%`, k.n ? (k.healthy >= 80 ? "good" : k.healthy < 75 ? "bad" : "warn") : ""),
      kpiCard("High velocity rate", k.fast.toFixed(1) + "%", "≤ 30 steps with 0 errors", k.n ? (k.fast >= 50 ? "good" : "") : ""),
      kpiCard("Tool invocations", fmt(k.calls), `${k.errRate.toFixed(2)}% error rate · target < 1.5%`, k.n ? (k.errRate < 1.5 ? "good" : k.errRate > 3 ? "bad" : "warn") : ""),
    ].join("");
  }

  /* ---------- tiny SVG chart kit ---------- */
  function donut(items, opts = {}) {
    const total = items.reduce((a, d) => a + d.v, 0);
    if (!total) return `<div class="empty">No data in this window.</div>`;
    let a0 = -Math.PI / 2, paths = "";
    const R = 64, r = 40, cx = 75, cy = 75;
    for (const d of items) {
      const a1 = a0 + (2 * Math.PI * d.v) / total, large = a1 - a0 > Math.PI ? 1 : 0;
      const p = (a, rad) => `${cx + rad * Math.cos(a)},${cy + rad * Math.sin(a)}`;
      paths += d.v === total ? `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${d.c}" stroke-width="${R - r}"><title>${esc(d.k)}: ${fmt(d.v)}</title></circle>`
        : `<path d="M${p(a0, R)} A${R},${R} 0 ${large} 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 ${large} 0 ${p(a0, r)} Z" fill="${d.c}"><title>${esc(d.k)}: ${fmt(d.v)} (${pct(d.v, total).toFixed(1)}%)</title></path>`;
      a0 = a1;
    }
    const legend = items.map((d) => `<span><i style="background:${d.c}"></i>${esc(d.k)} · ${opts.fmt ? opts.fmt(d.v) : fmt(d.v)} (${pct(d.v, total).toFixed(0)}%)</span>`).join("");
    return `<div class="donutwrap"><svg viewBox="0 0 150 150" width="190" height="190" role="img" aria-label="${esc(opts.label || "")}">${paths}<text x="75" y="72" text-anchor="middle" style="font-size:18px;font-weight:700;fill:var(--ink)">${opts.center ?? fmt(total)}</text><text x="75" y="92" text-anchor="middle" style="font-size:11px">${esc(opts.centerSub || "total")}</text></svg><div class="legend" style="flex-direction:column">${legend}</div></div>`;
  }
  function hbars(items, opts = {}) {
    if (!items.length) return `<div class="empty">No data in this window.</div>`;
    const W = opts.w || halfW(), max = Math.max(...items.map((d) => d.v)), rowH = 30, labelW = Math.min(opts.labelW || 160, Math.round(W * 0.34)), H = items.length * rowH + 4;
    const rows = items.map((d, i) => {
      const room = W - labelW - (items.some((x) => x.extra) ? 250 : 80), w = max ? (Math.max(room, 40) * d.v) / max : 0, y = i * rowH + 2;
      const maxChars = Math.floor(labelW / 7.5), name = shortName(d.k);
      return `<text x="${labelW - 8}" y="${y + 19}" text-anchor="end">${esc(fitName(name, maxChars))}</text><rect x="${labelW}" y="${y + 5}" width="${Math.max(w, 1)}" height="${rowH - 10}" rx="3" fill="${d.c || color(0)}"><title>${esc(d.k)}: ${opts.fmt ? opts.fmt(d.v) : fmt(d.v)}</title></rect><text x="${labelW + w + 8}" y="${y + 19}">${opts.fmt ? opts.fmt(d.v) : fmt(d.v)}${d.extra ? " · " + d.extra : ""}</text>`;

      kpiCard("Est. cost per commit", n ? money(k.cost / n) : "—", `${money(k.cost)} total, API list prices`),
      kpiCard("Context cache savings", money(k.savings), `${short(k.read)} tokens read from cache`, "good"),
      kpiCard("Issues linked", fmt(new Set(mine.flatMap((c) => c.issues)).size), "in your commits"),
    ].join("");
    const days = new Map();
    for (const r of runs) { const d = (r.started || "").slice(0, 10); const e = days.get(d) || { t: 0, c: 0 }; e.t += r.input_tokens + r.cache_write_tokens + r.output_tokens; days.set(d, e); }
    for (const c of mine) { const d = c.date.slice(0, 10); const e = days.get(d) || { t: 0, c: 0 }; e.c++; days.set(d, e); }
    const dl = [...days.entries()].filter(([d]) => d).sort().slice(-21), maxT = Math.max(1, ...dl.map(([, e]) => e.t)), maxC = Math.max(1, ...dl.map(([, e]) => e.c));
    $("#rcharts").innerHTML = card("roi-daily", "Tokens and commits by day", "Bars: your commits. Line: agent tokens, as a share of the busiest day.", vbars(dl.map(([d, e]) => ({ k: d.slice(5), v: e.c, tk: (100 * e.t) / maxT })), { label: "Tokens and commits", series: [{ key: "v", name: "My commits", c: color(2) }], line: { key: "tk", name: "Tokens (% of peak)", c: color(0) }, lineMax: 100, h: 260, w: wideW() }), "Correlation, not attribution: commits and agent sessions are matched by day only.", "wide");
  }

  /* ---------- glue ---------- */
  function fillSelect(id, label, values, cur) {
    $(id).innerHTML = `<option value="">${label}</option>` + values.map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  }
  function render() {
    if (!state.data) return;
    const runs = filtered();
    $("#n-agents").textContent = fmt(runs.length);
    $("#n-code").textContent = fmt(filteredCommits().length);
    for (const m of ["agents", "code", "roi"]) $("#mode-" + m).classList.toggle("hide", state.mode !== m);
    if (state.mode === "agents") { renderKpis(runs); renderChartTabs(); renderCharts(runs); renderTable(runs); }
    else if (state.mode === "code") renderCode();
    else renderRoi();
  }
  async function load(force) {
    try {
      const res = await fetch(force ? "/api/sync" : "/api/telemetry", { method: force ? "POST" : "GET" });
      state.data = await res.json();
      followServerInterval(state.data.store?.sync_interval);
      const all = state.data.runs;
      fillSelect("#f-agent", "All agents", [...new Set(all.map((r) => r.agent))].sort(), state.agent);
      const machines = state.data.store?.machines || [];
      fillSelect("#f-machine", "All machines", machines, state.machine);
      $("#f-machine").classList.toggle("hide", machines.length < 2);
      const st = state.data.store || {}, ls = st.last_sync || {};
      $("#storeline").innerHTML = `Store <b>${esc(st.path || "")}</b> · this machine <b>${esc(st.machine || "")}</b>${machines.length > 1 ? ` · ${machines.length} machines` : ""} · remote <b>${esc(st.remote || "none")}</b>${ls.at ? ` · last sync ${esc(ls.at.slice(11, 19))}, ${ls.parsed || 0} files read${ls.pushed ? `, ${ls.pushed} pushed` : ""}` : ""}`;
      fillSelect("#f-model", "All models", [...new Set(all.map((r) => r.model))].sort(), state.model);
      fillSelect("#f-health", "All outcomes", state.data.health_order, state.health);
      $("#synced").textContent = "⏱ Synced " + new Date().toLocaleTimeString();
      render();
    } catch (err) { $("#synced").textContent = "Sync failed: " + err.message; }
  }
  // Until the viewer picks an interval here, the page refreshes as often as the server syncs (--sync-interval).
  function followServerInterval(secs) {
    if (state.pickedInterval || !secs || state.followed === secs) return;
    state.followed = secs;
    const sel = $("#sync-every");
    if (![...sel.options].some((o) => +o.value === secs)) {
      const label = secs % 60 === 0 ? `${secs / 60}m` : `${secs}s`;
      sel.add(new Option(label, String(secs)), [...sel.options].find((o) => +o.value > secs || +o.value === 0));
    }
    sel.value = String(secs);
    schedule();
  }
  function schedule() {
    clearInterval(state.timer);
    const s = +$("#sync-every").value;
    $("#sync-dot").classList.toggle("on", s > 0);
    if (s > 0) state.timer = setInterval(() => load(false), s * 1000);
  }
  const press = (group, btn) => group.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  $("#modes").onclick = (e) => { const b = e.target.closest("[data-mode]"); if (!b) return; state.mode = b.dataset.mode; press($("#modes"), b); render(); };
  $("#win").onclick = (e) => { const b = e.target.closest("[data-days]"); if (!b) return; state.days = +b.dataset.days; state.from = state.to = ""; $("#from").value = $("#to").value = ""; press($("#win"), b); render(); };
  $("#from").onchange = (e) => { state.from = e.target.value; press($("#win"), null); render(); };
  $("#to").onchange = (e) => { state.to = e.target.value; press($("#win"), null); render(); };
  $("#gran").onclick = (e) => { const b = e.target.closest("[data-g]"); if (!b) return; state.gran = b.dataset.g; press($("#gran"), b); render(); };
  let qt; $("#q").oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 150); };
  $("#f-agent").onchange = (e) => { state.agent = e.target.value; render(); };
  $("#f-machine").onchange = (e) => { state.machine = e.target.value; render(); };
  $("#f-model").onchange = (e) => { state.model = e.target.value; render(); };
  $("#f-health").onchange = (e) => { state.health = e.target.value; render(); };
  $("#ctabs").onclick = (e) => { const b = e.target.closest("[data-ct]"); if (!b) return; state.chartTab = b.dataset.ct; render(); };
  $("#runs thead").onclick = (e) => { const th = e.target.closest("[data-sort]"); if (!th) return; const k = th.dataset.sort; state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : -1 }; render(); };
  $("#sync-now").onclick = () => load(true);
  $("#sync-every").onchange = () => { state.pickedInterval = true; try { localStorage.setItem("ao-sync", $("#sync-every").value); } catch (e) {} schedule(); };
  $("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("ao-theme", t); } catch (e) {} render(); };
  $("#inspect-close").onclick = () => $("#inspect").close();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 200); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && +$("#sync-every").value) load(false); });
  try { const t = localStorage.getItem("ao-theme"); if (t) document.documentElement.dataset.theme = t; const ps = +localStorage.getItem("ao-page-size"); if ([10, 25, 50, 100].includes(ps)) state.pageSize = ps; const s = localStorage.getItem("ao-sync"); if (s && [...$("#sync-every").options].some((o) => o.value === s)) { $("#sync-every").value = s; state.pickedInterval = true; } } catch (e) {}
  schedule();
  load(false);
})();
</script>
</body>
</html>
