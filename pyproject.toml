[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrail"
version = "0.1.0"
description = "Local telemetry and dashboard for AI coding agents: tokens, tools, skills, health and shipped code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.10"]
s3 = ["boto3>=1.28"]
all = ["google-cloud-storage>=2.10", "boto3>=1.28"]

[project.scripts]
tokentrail = "tokentrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokentrail = ["static/*.html"]
