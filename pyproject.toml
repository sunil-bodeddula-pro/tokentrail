[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrail"
version = "0.1.0"
description = "Local telemetry and dashboard for AI coding agents: tokens, tools, skills, health and shipped code."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sunil Bodeddula" }]
keywords = ["ai-agents", "observability", "telemetry", "llm", "claude-code", "dashboard", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.10"]
s3 = ["boto3>=1.28"]
all = ["google-cloud-storage>=2.10", "boto3>=1.28"]

[project.urls]
Homepage = "https://github.com/sunil-bodeddula-pro/tokentrail"
Issues = "https://github.com/sunil-bodeddula-pro/tokentrail/issues"

[project.scripts]
tokentrail = "tokentrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokentrail = ["static/*.html"]
