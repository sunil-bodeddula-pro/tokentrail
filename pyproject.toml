[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrail"
version = "0.1.0"
description = "Local telemetry and dashboard for AI coding agents: tokens, tools, skills, health and shipped code."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sunil Bodeddula" }]
keywords = ["ai-agents", "observability", "telemetry", "llm", "claude-code", "dashboard", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.10"]
s3 = ["boto3>=1.28"]
all = ["google-cloud-storage>=2.10", "boto3>=1.28"]
dev = ["ruff>=0.17", "mypy>=2.4"]

[project.urls]
Homepage = "https://github.com/sunil-bodeddula-pro/tokentrail"
Issues = "https://github.com/sunil-bodeddula-pro/tokentrail/issues"

[project.scripts]
tokentrail = "tokentrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokentrail = ["static/*.html"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # long functions and many arguments are fine for parsers and the CLI
    "PLR0917", "PLR2004",                                   # thresholds are named in the health rules and README
    "RUF001", "RUF002", "RUF003",                # the docs use typographic dashes and ellipses on purpose
    "C408",                                      # dict(key=value) reads better for event and run fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "E402"]
"src/tokentrail/mirror.py" = ["PLC0415"]  # cloud clients are optional extras, imported when used

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src/tokentrail"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["google.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
